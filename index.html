<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Window has no frame (so this title is never shown as UI chrome) but it IS what any
         window-title enumeration outside screen capture — e.g. an exam-proctoring tool that
         calls GetWindowText on every open window, independent of what's actually being
         screen-recorded — would see. "Stealth AI Assistant" was handing that exact signal
         to the one class of check SetWindowDisplayAffinity can't hide from. -->
    <title>Ghotly AI</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Stealth AI coding assistant for technical interviews"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        background: transparent !important;
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body style="background: transparent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
